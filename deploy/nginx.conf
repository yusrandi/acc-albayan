# ==============================================================================
# KONFIGURASI NGINX DUA DOMAIN: FE (accalbayan.com) & BE (api.accalbayan.com)
# Simpan di: /etc/nginx/sites-available/albayan
# Aktifkan: sudo ln -s /etc/nginx/sites-available/albayan /etc/nginx/sites-enabled/
# Uji & reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BACKEND API: api.accalbayan.com -> Node.js Express (Port 3001)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.accalbayan.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. FRONTEND SPA: accalbayan.com & www.accalbayan.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name accalbayan.com www.accalbayan.com;

    # Folder tempat proyek berada di VPS
    root /var/www/albayan-accounting;
    index index.html;

    client_max_body_size 50M;

    # Kompresi Gzip untuk loading super cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cadangan: jika ada request /api langsung ke accalbayan.com
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
