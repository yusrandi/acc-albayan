# ==============================================================================
# NGINX DUAL DOMAIN CONFIGURATION FOR AL BAYAN ACCOUNTING
# Simpan di: /etc/nginx/sites-available/albayan
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BACKEND API: api.accalbayan.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.accalbayan.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. FRONTEND DASHBOARD: accalbayan.com & www.accalbayan.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name accalbayan.com www.accalbayan.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
