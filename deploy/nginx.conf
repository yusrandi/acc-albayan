# Nginx Virtual Host Configuration
# Simpan di: /etc/nginx/sites-available/albayan-accounting
# Aktifkan: ln -s /etc/nginx/sites-available/albayan-accounting /etc/nginx/sites-enabled/
# Uji & reload: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Ganti dengan domain Anda atau IP VPS

    client_max_body_size 50M;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy ke Node.js Backend & Frontend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
